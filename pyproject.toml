[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "diskhog"
version = "1.0.0"
description = "Find the biggest files, folders and duplicates eating your disk"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.scripts]
diskhog = "diskhog:main"

[tool.setuptools]
py-modules = ["diskhog"]
