<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">Diskhog</title><desc id="d">A disk usage map highlights large files and folders.</desc><defs><linearGradient id="bg"><stop stop-color="#19273c"/><stop offset="1" stop-color="#09111d"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/><g fill="#183448" stroke="#62e3c1" stroke-width="2"><rect x="100" y="85" width="270" height="150" rx="12"/><rect x="390" y="85" width="150" height="150" rx="12"/><rect x="560" y="85" width="120" height="150" rx="12"/><rect x="700" y="85" width="90" height="150" rx="12"/></g><g fill="#edf3ff" font-family="monospace" font-size="15"><text x="130" y="130">LARGE FILE</text><text x="130" y="175">4.2 GB</text><text x="415" y="165">1.8 GB</text><text x="585" y="165">920 MB</text><text x="718" y="165">420 MB</text></g><path d="M100 255H790" stroke="#8fa8ff" stroke-width="3"><animate attributeName="stroke-dasharray" values="0 690;690 0" dur="4s" repeatCount="indefinite"/></path><text x="58" y="48" fill="#edf3ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">DISKHOG</text><text x="1140" y="48" text-anchor="end" fill="#91a0ba" font-family="monospace" font-size="13" letter-spacing="3">SCAN / SIZE / FIND SPACE</text></svg>